mixed-port: 7890
proxy-providers:
  示例订阅:
    type: http
    url: https://example.com/proxies.yaml
    path: ./providers/demo.yaml
rule-providers:
  示例规则:
    type: http
    behavior: domain
    url: https://example.com/rules.yaml
    path: ./rules/demo.yaml
proxies:
  - name: 🇭🇰 示例节点
    type: socks5
    server: 127.0.0.1
    port: 1080
  - {name: 行内节点, type: http, server: 127.0.0.1, port: 8080}
group-defaults: &defaults
  type: select
proxy-groups:
  - name: 🚀 节点选择
    <<: *defaults
    proxies: [DIRECT, 🇭🇰 示例节点]
  - name: 🤖 AI
    type: select
    proxies: [🚀 节点选择, DIRECT]
dns:
  enable: true
rules:
  - MATCH,🚀 节点选择
